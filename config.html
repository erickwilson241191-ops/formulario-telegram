<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #006699;
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-bg: #eef2f5;
      --card-border: #cccccc;
      --font-scale: 1.1;
    }

    body.theme-black {
      --primary-color: #33b5e5;
      --bg-color: #000000;
      --text-color: #ffffff;
      --secondary-bg: #121212;
      --card-border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale));
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: calc(20px * var(--font-scale));
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
    }

    .config-card {
      background: var(--secondary-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .config-title {
      font-size: calc(16px * var(--font-scale));
      font-weight: 800;
      margin-bottom: 6px;
    }

    .config-desc {
      font-size: calc(13px * var(--font-scale));
      color: var(--text-color);
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-theme {
      padding: 12px;
      border-radius: 10px;
      border: 2px solid var(--card-border);
      font-weight: bold;
      font-size: calc(14px * var(--font-scale));
      cursor: pointer;
      text-align: center;
    }

    .btn-theme-light { background: #ffffff; color: #000000; }
    .btn-theme-black { background: #000000; color: #ffffff; border-color: #555; }

    .btn-theme.active {
      border: 3px solid var(--primary-color);
      box-shadow: 0 0 6px var(--primary-color);
    }

    .font-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-font {
      flex: 1;
      padding: 12px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: calc(16px * var(--font-scale));
      cursor: pointer;
    }

    /* ESTILOS DO TOGGLE SWITCH PARA O RELATÓRIO */
    .switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2ea44f;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .btn-save {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>⚙️ Configurações</h2>

  <!-- RELATÓRIO DIÁRIO -->
  <div class="config-card">
    <div class="switch-container">
      <div>
        <div class="config-title">📊 Relatório Diário</div>
        <div class="config-desc">Enviar resumo diário às 07:00</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleRelatorio">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- SELEÇÃO DE TEMA -->
  <div class="config-card">
    <div class="config-title">🎨 Tema Visual</div>
    <div class="config-desc">Escolha a combinação de cores mais confortável:</div>
    <div class="theme-options">
      <div id="btnThemeLight" class="btn-theme btn-theme-light" onclick="definirTema('light')">☀️ Alto Contraste</div>
      <div id="btnThemeBlack" class="btn-theme btn-theme-black" onclick="definirTema('black')">🌙 Tema Black</div>
    </div>
  </div>

  <!-- TAMANHO DO TEXTO -->
  <div class="config-card">
    <div class="config-title">🔍 Tamanho do Texto</div>
    <div class="config-desc">Aumente ou diminua as letras do aplicativo:</div>
    <div class="font-controls">
      <button class="btn-font" onclick="alterarFonte(-0.1)">A- Diminuir</button>
      <button class="btn-font" onclick="alterarFonte(0.1)">A+ Aumentar</button>
    </div>
  </div>

  <button class="btn-save" onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // BOTÃO VOLTAR NATIVO DO TELEGRAM
    tg.BackButton.show();
    tg.BackButton.onClick(function() {
      window.location.href = 'index.html';
    });

    let fontScale = parseFloat(localStorage.getItem('userFontScale')) || 1.1;
    let currentTheme = localStorage.getItem('userTheme') || 'light';

    // Lê variável vinda do parâmetro URL enviado pelo Python (?relatorio=true/false)
    const urlParams = new URLSearchParams(window.location.search);
    const relatorioStatus = urlParams.get('relatorio');
    
    if (relatorioStatus !== null) {
      document.getElementById('toggleRelatorio').checked = (relatorioStatus === 'true');
    }

    function aplicarPreferencias() {
      document.documentElement.style.setProperty('--font-scale', fontScale);
      
      if (currentTheme === 'black') {
        document.body.classList.add('theme-black');
        document.getElementById('btnThemeBlack').classList.add('active');
        document.getElementById('btnThemeLight').classList.remove('active');
      } else {
        document.body.classList.remove('theme-black');
        document.getElementById('btnThemeLight').classList.add('active');
        document.getElementById('btnThemeBlack').classList.remove('active');
      }
    }

    function definirTema(tema) {
      currentTheme = tema;
      localStorage.setItem('userTheme', tema);
      aplicarPreferencias();
    }

    function alterarFonte(delta) {
      fontScale = Math.min(Math.max(fontScale + delta, 0.9), 1.5);
      localStorage.setItem('userFontScale', fontScale);
      aplicarPreferencias();
    }

    function salvarConfiguracoes() {
      const isRelatorioAtivo = document.getElementById('toggleRelatorio').checked;

      const payload = {
        acao: "ATUALIZAR_CONFIGS",
        relatorioAtivo: isRelatorioAtivo
      };

      // Envia a configuração salva para o Bot via Telegram WebApp
      tg.sendData(JSON.stringify(payload));
    }

    aplicarPreferencias();
  </script>
</body>
</html>
