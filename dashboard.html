<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Gestão</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { 
      --primary-color: #0088cc; 
      --bg-color: var(--tg-theme-bg-color, #ffffff); 
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5); 
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg-color); 
      margin: 0; 
      padding: 12px; 
    }
    h2 { 
      color: var(--primary-color); 
      margin-top: 0; 
      font-size: 1.3em; 
    }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .card-metric { background: var(--secondary-bg); border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #e0e0e0; }
    .card-metric .num { font-size: 1.6em; font-weight: bold; color: var(--primary-color); }
    .card-metric .label { font-size: 0.8em; color: #666; text-transform: uppercase; margin-top: 4px; }
    
    .chart-box { background: var(--secondary-bg); border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #e0e0e0; }
    .chart-title { font-size: 0.95em; font-weight: bold; margin-bottom: 10px; }
    .bar-group { margin-bottom: 8px; }
    .bar-label { font-size: 0.8em; display: flex; justify-content: space-between; margin-bottom: 2px; }
    .bar-bg { background: #e0e0e0; height: 10px; border-radius: 5px; overflow: hidden; }
    .bar-fill { background: var(--primary-color); height: 100%; width: 0%; transition: width 0.5s ease; }
  </style>
</head>
<body>

  <h2>📊 Painel de Indicadores</h2>

  <div class="grid">
    <div class="card-metric"><div class="num" id="totalOcorrencias">0</div><div class="label">Total Ocorrências</div></div>
    <div class="card-metric"><div class="num" id="totalAbertas" style="color:#c62828">0</div><div class="label">Em Aberto</div></div>
  </div>

  <div class="chart-box">
    <div class="chart-title">⚙️ Ocorrências por Máquina</div>
    <div id="chartMaquinas"></div>
  </div>

  <div class="chart-box">
    <div class="chart-title">📌 Status das Solicitações</div>
    <div id="chartStatus"></div>
  </div>

  <script>
    // Carregar preferências de fonte salvas
    (function aplicarFonteSalva() {
      const fonteSalva = localStorage.getItem('tamanhoFonte');
      if (fonteSalva) {
        document.documentElement.style.fontSize = fonteSalva + 'px';
      }
    })();

    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = 'index.html');

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function carregarDashboard() {
      try {
        const response = await fetch(URL_GVIZ);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        if (!rows) return;

        let total = rows.length;
        let abertas = 0;
        let maquinasCount = {};
        let statusCount = {};

        rows.forEach(r => {
          const maquina = r.c[3]?.v || 'Indefinido';
          const status = r.c[6]?.v || 'Indefinido';

          if (status.includes('Aberto')) abertas++;

          maquinasCount[maquina] = (maquinasCount[maquina] || 0) + 1;
          statusCount[status] = (statusCount[status] || 0) + 1;
        });

        document.getElementById('totalOcorrencias').innerText = total;
        document.getElementById('totalAbertas').innerText = abertas;

        renderBarChart('chartMaquinas', maquinasCount, total);
        renderBarChart('chartStatus', statusCount, total);

      } catch (e) { console.error(e); }
    }

    function renderBarChart(elementId, dataObj, total) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';

      Object.keys(dataObj).forEach(key => {
        const val = dataObj[key];
        const pct = Math.round((val / total) * 100);
        
        container.innerHTML += `
          <div class="bar-group">
            <div class="bar-label"><span>${key}</span> <span>${val} (${pct}%)</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: ${pct}%;"></div></div>
          </div>
        `;
      });
    }

    carregarDashboard();
  </script>
</body>
</html>
