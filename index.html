<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ocorrências</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #0088cc;
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .tabs {
      display: flex;
      margin-bottom: 16px;
      border-bottom: 2px solid #ddd;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-option {
      padding: 10px 6px;
      background: var(--secondary-bg);
      border: 2px solid transparent;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-option.selected {
      border-color: var(--primary-color);
      background-color: rgba(0, 136, 204, 0.1);
      color: var(--primary-color);
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- NAVEGAÇÃO -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('registrar')">📝 Nova Ocorrência</button>
    <button class="tab-btn" onclick="switchTab('pesquisar')">🔎 Pesquisar</button>
  </div>

  <!-- ABA 1: REGISTRAR -->
  <div id="tab-registrar" class="tab-content active">
    <form id="ocorrenciaForm">
      <div class="form-group">
        <label for="maquina">🏭 Máquina / Equipamento:</label>
        <select id="maquina" required>
          <option value="Passador 01">Passador 01</option>
          <option value="Passador 02">Passador 02</option>
          <option value="Maçaroca 01">Maçaroca 01</option>
          <option value="Maçaroca 02">Maçaroca 02</option>
          <option value="Filatório 01">Filatório 01</option>
          <option value="Filatório 02">Filatório 02</option>
          <option value="Conicaleira 01">Conicaleira 01</option>
          <option value="Open End 01">Open End 01</option>
          <option value="Outra / Geral">Outra / Geral</option>
        </select>
      </div>

      <!-- BOTÕES DE CATEGORIA -->
      <div class="form-group">
        <label>🏷️ Categoria:</label>
        <div class="grid-selector" id="categoria-group">
          <div class="btn-option selected" onclick="selectOption('categoria', '🛠️ Corretiva', this)">🛠️ Corretiva</div>
          <div class="btn-option" onclick="selectOption('categoria', '📅 Preventiva', this)">📅 Preventiva</div>
          <div class="btn-option" onclick="selectOption('categoria', '💡 Melhoria', this)">💡 Melhoria</div>
          <div class="btn-option" onclick="selectOption('categoria', '⏳ Pendência', this)">⏳ Pendência</div>
        </div>
      </div>

      <!-- BOTÕES DE STATUS -->
      <div class="form-group">
        <label>🚨 Status Inicial:</label>
        <div class="grid-selector" id="status-group">
          <div class="btn-option selected" onclick="selectOption('status', '🔴 Aberto', this)">🔴 Aberto</div>
          <div class="btn-option" onclick="selectOption('status', '🟡 Em Andamento', this)">🟡 Em Andamento</div>
          <div class="btn-option" onclick="selectOption('status', '🟢 Concluído', this)">🟢 Concluído</div>
          <div class="btn-option" onclick="selectOption('status', '⚪ Cancelado', this)">⚪ Cancelado</div>
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">📝 Descrição:</label>
        <textarea id="descricao" rows="3" placeholder="Descreva os detalhes..." required></textarea>
      </div>

      <!-- OPÇÃO DE ENVIAR PARA O GRUPO -->
      <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="enviarGrupo" checked style="width: auto; margin: 0;">
        <label for="enviarGrupo" style="margin: 0; font-weight: normal; cursor: pointer;">
          📢 Enviar notificação para o grupo
        </label>
      </div>

      <button type="submit" class="submit-btn">🚀 Registrar Ocorrência</button>
    </form>
  </div>

  <!-- ABA 2: PESQUISAR -->
  <div id="tab-pesquisar" class="tab-content">
    <div class="form-group">
      <label for="campo-busca">🔎 Termo de Busca:</label>
      <input type="text" id="campo-busca" placeholder="Digite máquina, ID ou palavra-chave...">
    </div>
    <button type="button" class="submit-btn" onclick="executarPesquisa()">Buscar Ocorrências</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedCategoria = '🛠️ Corretiva';
    let selectedStatus = '🔴 Aberto';

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'registrar') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-registrar').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-pesquisar').classList.add('active');
      }
    }

    function selectOption(type, value, element) {
      const group = document.getElementById(`${type}-group`);
      group.querySelectorAll('.btn-option').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      if (type === 'categoria') selectedCategoria = value;
      if (type === 'status') selectedStatus = value;
    }

    document.getElementById('ocorrenciaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const payload = {
        tipo: 'NOVA_OCORRENCIA',
        maquina: document.getElementById('maquina').value,
        categoria: selectedCategoria,
        status: selectedStatus,
        descricao: document.getElementById('descricao').value,
        enviarGrupo: document.getElementById('enviarGrupo').checked
      };

      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    function executarPesquisa() {
      const termo = document.getElementById('campo-busca').value;
      if (!termo) return;

      const payload = {
        tipo: 'PESQUISAR',
        termo: termo
      };
      
      tg.sendData(JSON.stringify(payload));
      tg.close();
    }
  </script>
</body>
</html>
