<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrência</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; text-align: center; color: #0088cc; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active { background-color: #006699; }
  </style>
</head>
<body>

  <h2>📋 Nova Ocorrência</h2>

  <form id="ocorrenciaForm">
    <div class="form-group">
      <label for="maquina">🏭 Máquina / Equipamento:</label>
      <select id="maquina" required>
        <option value="Passador 01">Passador 01</option>
        <option value="Passador 02">Passador 02</option>
        <option value="Maçaroca 01">Maçaroca 01</option>
        <option value="Maçaroca 02">Maçaroca 02</option>
        <option value="Filatório 01">Filatório 01</option>
        <option value="Filatório 02">Filatório 02</option>
        <option value="Conicaleira 01">Conicaleira 01</option>
        <option value="Open End 01">Open End 01</option>
        <option value="Outra / Geral">Outra / Geral</option>
      </select>
    </div>

    <div class="form-group">
      <label for="categoria">🏷️ Categoria:</label>
      <select id="categoria" required>
        <option value="🛠️ Corretiva">🛠️ Corretiva</option>
        <option value="📅 Preventiva">📅 Preventiva</option>
        <option value="💡 Melhoria">💡 Melhoria</option>
        <option value="⏳ Pendência">⏳ Pendência</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status">🚨 Status Inicial:</label>
      <select id="status" required>
        <option value="🔴 Aberto">🔴 Aberto</option>
        <option value="🟡 Em Andamento">🟡 Em Andamento</option>
        <option value="🟢 Concluído">🟢 Concluído</option>
        <option value="⚪ Cancelado">⚪ Cancelado</option>
      </select>
    </div>

    <div class="form-group">
      <label for="descricao">📝 Descrição do Ocorrido:</label>
      <textarea id="descricao" rows="4" placeholder="Descreva os detalhes..." required></textarea>
    </div>

    <button type="submit">🚀 Registrar Ocorrência</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Abre o formulário em tela cheia no celular

    document.getElementById('ocorrenciaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const dados = {
        maquina: document.getElementById('maquina').value,
        categoria: document.getElementById('categoria').value,
        status: document.getElementById('status').value,
        descricao: document.getElementById('descricao').value
      };

      // Envia o JSON dos dados preenchidos diretamente de volta para o Bot do Telegram
      tg.sendData(JSON.stringify(dados));
    });
  </script>
</body>
</html>
