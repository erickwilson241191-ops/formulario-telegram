<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Ocorrências</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #006699;
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-bg: #eef2f5;
      --card-border: #cccccc;
      --font-scale: 1.1;
    }

    body.theme-black {
      --primary-color: #33b5e5;
      --bg-color: #000000;
      --text-color: #ffffff;
      --secondary-bg: #121212;
      --card-border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale));
    }

    .header { margin-bottom: 20px; }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .user-greeting {
      font-size: calc(22px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-color);
    }

    .btn-config {
      background: var(--secondary-bg);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: calc(14px * var(--font-scale));
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
    }

    .subtitle {
      margin: 0;
      font-size: calc(15px * var(--font-scale));
      font-weight: 600;
      opacity: 0.8;
    }

    .kpi-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      border: 2px solid var(--card-border);
      cursor: pointer;
    }

    .kpi-value {
      font-size: calc(26px * var(--font-scale));
      font-weight: 900;
      margin-bottom: 4px;
    }

    .kpi-label {
      font-size: calc(12px * var(--font-scale));
      text-transform: uppercase;
      font-weight: 800;
    }

    .section-title {
      font-size: calc(15px * var(--font-scale));
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 4px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .menu-card {
      background: var(--secondary-bg);
      border: 2px solid var(--primary-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .card-icon {
      font-size: calc(28px * var(--font-scale));
      margin-right: 16px;
      background: var(--bg-color);
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
    }

    .card-content h3 {
      margin: 0;
      font-size: calc(18px * var(--font-scale));
      color: var(--primary-color);
      font-weight: bold;
    }

    .card-content p {
      margin: 4px 0 0 0;
      font-size: calc(13px * var(--font-scale));
      opacity: 0.8;
      font-weight: 600;
    }

    .feed-container {
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 24px;
      border: 2px solid var(--card-border);
      max-height: 220px;
      overflow-y: auto;
    }

    .feed-item {
      padding: 10px 0;
      border-bottom: 2px dashed var(--card-border);
      font-size: calc(14px * var(--font-scale));
    }

    .feed-item:last-child { border-bottom: none; }

    .feed-header {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO COM BOTÃO DE CONFIGURAÇÃO -->
  <div class="header">
    <div class="top-info">
      <div class="user-greeting" id="userName">Olá! 👋</div>
      <button class="btn-config" onclick="navegarPara('config.html')">⚙️ Configs</button>
    </div>
    <p class="subtitle">Central de Gestão e Manutenção</p>
  </div>

  <!-- INDICADORES -->
  <div class="kpi-container">
    <div class="kpi-card" onclick="filtrarPorStatus('Aberto')">
      <div class="kpi-value" id="kpiAbertos" style="color: #ff4d4d;">-</div>
      <div class="kpi-label">Abertos 🔴</div>
    </div>
    <div class="kpi-card" onclick="filtrarPorStatus('Andamento')">
      <div class="kpi-value" id="kpiAndamento" style="color: #ffaa00;">-</div>
      <div class="kpi-label">Andamento 🟡</div>
    </div>
    <div class="kpi-card" onclick="filtrarPorStatus('Concluído')">
      <div class="kpi-value" id="kpiConcluidos" style="color: #2ecc71;">-</div>
      <div class="kpi-label">Concluídos 🟢</div>
    </div>
  </div>

  <!-- MENUS -->
  <div class="section-title">Ações Principais</div>
  <div class="menu-grid">
    <div class="menu-card" onclick="navegarPara('newform.html')">
      <div class="card-icon">📝</div>
      <div class="card-content">
        <h3>Nova Ocorrência</h3>
        <p>Cadastrar nova manutenção</p>
      </div>
    </div>

    <div class="menu-card" onclick="navegarPara('buscar.html')">
      <div class="card-icon">🔎</div>
      <div class="card-content">
        <h3>Consultar / Filtrar</h3>
        <p>Buscar ocorrências cadastradas</p>
      </div>
    </div>
  </div>

  <!-- FEED RECENTE -->
  <div class="section-title">Últimos Lançamentos</div>
  <div class="feed-container" id="feedRecente">
    <div style="text-align: center; padding: 12px;">⏳ Carregando registros...</div>
  </div>

  <button class="btn-voltar" onclick="fecharTelegram()">
    ⬅️ Voltar para o Chat do Telegram
  </button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Carregar configurações do usuário
    function aplicarPreferencias() {
      const fontScale = localStorage.getItem('userFontScale') || 1.1;
      const theme = localStorage.getItem('userTheme') || 'light';

      document.documentElement.style.setProperty('--font-scale', fontScale);

      if (theme === 'black') {
        document.body.classList.add('theme-black');
      } else {
        document.body.classList.remove('theme-black');
      }
    }

    function carregarUsuario() {
  const user = tg.initDataUnsafe?.user;
  
  // 1. Tenta pegar o nome salvo manualmente no localStorage (se o usuário editou no config.html)
  const nomeSalvo = localStorage.getItem('userCustomName');
  
  // 2. Tenta pegar da URL (caso a URL da WebApp passe ?tecnico=Nome)
  const urlParams = new URLSearchParams(window.location.search);
  const nomeUrl = urlParams.get('tecnico') || urlParams.get('nome');
  
  // 3. Monta o nome vindo do Telegram WebApp (First Name + Last Name)
  let nomeTelegram = '';
  if (user) {
    const primeiroNome = user.first_name || '';
    const sobrenome = user.last_name || '';
    nomeTelegram = `${primeiroNome} ${sobrenome}`.trim();
  }

  // Define qual nome usar respeitando as prioridades
  const nomeFinal = nomeSalvo || nomeTelegram || nomeUrl || 'Técnico';

  // Exibe na tela inicial
  document.getElementById('userName').innerText = `Olá, ${nomeFinal}! 👋`;
}

    function navegarPara(pagina) { window.location.href = pagina; }
    function fecharTelegram() { tg.close(); }
    function filtrarPorStatus(status) { window.location.href = `buscar.html?status=${status}`; }

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function carregarDashboard() {
      try {
        const response = await fetch(URL_GVIZ);
        const text = await response.text();
        const jsonString = text.substring(47, text.length - 2);
        const data = JSON.parse(jsonString);

        const rows = data.table.rows;
        if (!rows || rows.length === 0) return;

        let abertos = 0, andamento = 0, concluidos = 0;

        const ocorrencias = rows.map(r => {
          const c = r.c;
          const status = c && c[6] ? String(c[6].v) : '';
          
          if (status.includes('Aberto')) abertos++;
          else if (status.includes('Andamento')) andamento++;
          else if (status.includes('Concluído')) concluidos++;

          return {
            id: c && c[0] ? c[0].v : '',
            maquina: c && c[3] ? c[3].v : '',
            descricao: c && c[5] ? c[5].v : '',
            status: status
          };
        });

        document.getElementById('kpiAbertos').innerText = abertos;
        document.getElementById('kpiAndamento').innerText = andamento;
        document.getElementById('kpiConcluidos').innerText = concluidos;

        const ultimas = ocorrencias.reverse().slice(0, 10);
        const feedContainer = document.getElementById('feedRecente');
        feedContainer.innerHTML = '';

        ultimas.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'feed-item';
          itemDiv.innerHTML = `
            <div class="feed-header">
              <span>#${item.id} - ${item.maquina}</span>
              <span style="color: var(--primary-color);">${item.status}</span>
            </div>
            <div>${item.descricao}</div>
          `;
          feedContainer.appendChild(itemDiv);
        });

      } catch (error) {
        console.error('Erro ao carregar dados:', error);
      }
    }

    aplicarPreferencias();
    carregarUsuario();
    carregarDashboard();
  </script>
</body>
</html>
