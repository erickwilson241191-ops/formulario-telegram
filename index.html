<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Ocorrências</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #006699; /* Azul mais escuro para maior contraste */
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: #111111; /* Texto quase preto para leitura facilitada */
      --secondary-bg: #eef2f5; /* Fundo dos cards com tom de contraste */
      --hint-color: #444444; /* Cinza bem escuro para leituras secundárias */
      --font-scale: 1; /* Escala de fonte dinâmica */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale)); /* Tamanho base maior */
    }

    /* BARRA DE ACCESSIBILIDADE DE FONTE */
    .accessibility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .font-btn {
      background: #ffffff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* CABEÇALHO */
    .header {
      margin-bottom: 20px;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .user-greeting {
      font-size: calc(22px * var(--font-scale));
      font-weight: 800;
      color: var(--primary-color);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: calc(13px * var(--font-scale));
      background: #d4edda;
      color: #155724;
      padding: 6px 10px;
      border-radius: 16px;
      font-weight: bold;
      border: 1px solid #c3e6cb;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #28a745;
      border-radius: 50%;
    }

    .subtitle {
      margin: 0;
      font-size: calc(15px * var(--font-scale));
      color: var(--hint-color);
      font-weight: 600;
    }

    /* INDICADORES (KPIs) - ALTAMENTE VISÍVEIS */
    .kpi-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      border: 2px solid #ccc;
      cursor: pointer;
    }

    .kpi-card:active {
      background-color: #d1d5db;
    }

    .kpi-value {
      font-size: calc(26px * var(--font-scale));
      font-weight: 900;
      margin-bottom: 4px;
    }

    .kpi-label {
      font-size: calc(13px * var(--font-scale));
      color: #000;
      text-transform: uppercase;
      font-weight: 800;
    }

    /* MENUS DE AÇÃO */
    .section-title {
      font-size: calc(15px * var(--font-scale));
      font-weight: 800;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 4px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .menu-card {
      background: var(--secondary-bg);
      border: 2px solid var(--primary-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .menu-card:active {
      transform: scale(0.97);
    }

    .card-icon {
      font-size: calc(30px * var(--font-scale));
      margin-right: 16px;
      background: #fff;
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #bbb;
    }

    .card-content h3 {
      margin: 0;
      font-size: calc(18px * var(--font-scale));
      color: var(--primary-color);
      font-weight: bold;
    }

    .card-content p {
      margin: 4px 0 0 0;
      font-size: calc(13px * var(--font-scale));
      color: var(--hint-color);
      font-weight: 600;
    }

    /* FEED DE ÚLTIMOS LANÇAMENTOS */
    .feed-container {
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 24px;
      border: 2px solid #ccc;
      max-height: 220px;
      overflow-y: auto;
    }

    .feed-item {
      padding: 10px 0;
      border-bottom: 2px dashed #bbb;
      font-size: calc(14px * var(--font-scale));
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .feed-desc {
      color: #333;
      font-weight: 500;
    }

    /* BOTÃO VOLTAR / FECHAR */
    .btn-voltar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
    }

    .btn-voltar:active {
      background-color: #333;
    }
  </style>
</head>
<body>

  <!-- CONTROLE DE ACESSIBILIDADE DE FONTE -->
  <div class="accessibility-bar">
    <span>Tamanho do Texto:</span>
    <div>
      <button class="font-btn" onclick="alterarFonte(-0.1)">A-</button>
      <button class="font-btn" onclick="alterarFonte(0.1)">A+</button>
    </div>
  </div>

  <!-- CABEÇALHO -->
  <div class="header">
    <div class="top-info">
      <div class="user-greeting" id="userName">Olá! 👋</div>
      <div class="status-badge">
        <span class="pulse-dot"></span> Online
      </div>
    </div>
    <p class="subtitle">Central de Gestão e Manutenção</p>
  </div>

  <!-- INDICADORES CLICÁVEIS -->
  <div class="kpi-container">
    <div class="kpi-card" onclick="filtrarPorStatus('Aberto')">
      <div class="kpi-value" id="kpiAbertos" style="color: #b71c1c;">-</div>
      <div class="kpi-label">Abertos 🔴</div>
    </div>
    <div class="kpi-card" onclick="filtrarPorStatus('Andamento')">
      <div class="kpi-value" id="kpiAndamento" style="color: #e65100;">-</div>
      <div class="kpi-label">Andamento 🟡</div>
    </div>
    <div class="kpi-card" onclick="filtrarPorStatus('Concluído')">
      <div class="kpi-value" id="kpiConcluidos" style="color: #1b5e20;">-</div>
      <div class="kpi-label">Concluídos 🟢</div>
    </div>
  </div>

  <!-- AÇÕES PRINCIPAIS -->
  <div class="section-title">Ações Principais</div>
  <div class="menu-grid">
    <div class="menu-card" onclick="navegarPara('newform.html')">
      <div class="card-icon">📝</div>
      <div class="card-content">
        <h3>Nova Ocorrência</h3>
        <p>Cadastrar nova manutenção</p>
      </div>
    </div>

    <div class="menu-card" onclick="navegarPara('buscar.html')">
      <div class="card-icon">🔎</div>
      <div class="card-content">
        <h3>Consultar / Filtrar</h3>
        <p>Buscar ocorrencias cadastradas</p>
      </div>
    </div>
  </div>

  <!-- FEED RECENTE -->
  <div class="section-title">Últimos Lançamentos</div>
  <div class="feed-container" id="feedRecente">
    <div style="text-align: center; color: #333; font-size: 14px; font-weight: bold; padding: 12px;">⏳ Carregando registros...</div>
  </div>

  <!-- BOTÃO FECHAR -->
  <button class="btn-voltar" onclick="fecharTelegram()">
    ⬅️ Voltar para o Chat do Telegram
  </button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Controle de fonte
    let fontScale = parseFloat(localStorage.getItem('userFontScale')) || 1.1; // Inicia em 1.1 (10% maior)
    document.documentElement.style.setProperty('--font-scale', fontScale);

    function alterarFonte(delta) {
      fontScale = Math.min(Math.max(fontScale + delta, 0.9), 1.5);
      document.documentElement.style.setProperty('--font-scale', fontScale);
      localStorage.setItem('userFontScale', fontScale);
    }

    function carregarUsuario() {
      const user = tg.initDataUnsafe?.user;
      if (user && user.first_name) {
        document.getElementById('userName').innerText = `Olá, ${user.first_name}! 👋`;
      } else {
        document.getElementById('userName').innerText = `Olá, Técnico! 👋`;
      }
    }
    carregarUsuario();

    function navegarPara(pagina) { window.location.href = pagina; }
    function fecharTelegram() { tg.close(); }
    function filtrarPorStatus(status) { window.location.href = `buscar.html?status=${status}`; }

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function carregarDashboard() {
      try {
        const response = await fetch(URL_GVIZ);
        const text = await response.text();
        const jsonString = text.substring(47, text.length - 2);
        const data = JSON.parse(jsonString);

        const rows = data.table.rows;
        if (!rows || rows.length === 0) return;

        let abertos = 0, andamento = 0, concluidos = 0;

        const ocorrencias = rows.map(r => {
          const c = r.c;
          const status = c && c[6] ? String(c[6].v) : '';
          
          if (status.includes('Aberto')) abertos++;
          else if (status.includes('Andamento')) andamento++;
          else if (status.includes('Concluído')) concluidos++;

          return {
            id: c && c[0] ? c[0].v : '',
            maquina: c && c[3] ? c[3].v : '',
            descricao: c && c[5] ? c[5].v : '',
            status: status
          };
        });

        document.getElementById('kpiAbertos').innerText = abertos;
        document.getElementById('kpiAndamento').innerText = andamento;
        document.getElementById('kpiConcluidos').innerText = concluidos;

        const ultimas = ocorrencias.reverse().slice(0, 10);
        const feedContainer = document.getElementById('feedRecente');
        feedContainer.innerHTML = '';

        ultimas.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'feed-item';
          itemDiv.innerHTML = `
            <div class="feed-header">
              <span>#${item.id} - ${item.maquina}</span>
              <span style="color: var(--primary-color);">${item.status}</span>
            </div>
            <div class="feed-desc">${item.descricao}</div>
          `;
          feedContainer.appendChild(itemDiv);
        });

      } catch (error) {
        console.error('Erro ao carregar dados:', error);
      }
    }

    carregarDashboard();
  </script>
</body>
</html>
