  <!-- CSS do Choices.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

  <style>
    :root {
      --primary-color: #006699;
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-bg: #eef2f5;
      --card-border: #cccccc;
      --font-scale: 1.1;
    }

    body.theme-black {
      --primary-color: #33b5e5;
      --bg-color: #000000;
      --text-color: #ffffff;
      --secondary-bg: #121212;
      --card-border: #333333;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale));
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: calc(20px * var(--font-scale));
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: calc(14px * var(--font-scale));
    }

    select, textarea, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: calc(15px * var(--font-scale));
      box-sizing: border-box;
      font-weight: 600;
    }

    input[type="file"] {
      padding: 8px;
    }

    input[readonly] {
      opacity: 0.75;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .historico-box {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 10px;
      margin-top: -8px;
      margin-bottom: 16px;
      border-radius: 6px;
      font-size: calc(13px * var(--font-scale));
      display: none;
      color: #0d47a1;
    }

    .erro-box {
      background: #fdf2f2;
      border-left: 4px solid #d9534f;
      padding: 10px;
      margin-top: -8px;
      margin-bottom: 16px;
      border-radius: 6px;
      font-size: calc(13px * var(--font-scale));
      color: #d9534f;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-sizing: border-box;
    }

    .btn-submit:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    /* --- CORREÇÃO DEFINITIVA DE ESTOURO DO CHOICES.JS --- */
    .choices {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      margin-bottom: 0 !important;
    }

    .choices__inner {
      width: 100% !important;
      max-width: 100% !important;
      min-height: auto !important;
      box-sizing: border-box !important;
      background-color: var(--secondary-bg) !important;
      border: 2px solid var(--card-border) !important;
      border-radius: 10px !important;
      color: var(--text-color) !important;
      padding: 6px 10px !important;
      overflow: hidden !important;
    }

    .choices__input {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      background-color: transparent !important;
      color: var(--text-color) !important;
    }

    .choices__list--dropdown {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      background-color: var(--secondary-bg) !important;
      color: var(--text-color) !important;
    }
  </style>
</head>

  <!-- JS do Choices.js -->
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(function() {
        window.location.href = 'index.html';
      });
    }

    let choicesInstance = null;
    document.addEventListener('DOMContentLoaded', () => {
      const selectMaquina = document.getElementById('maquina');
      
      try {
        choicesInstance = new Choices(selectMaquina, {
          searchEnabled: true,
          searchPlaceholderValue: '🔍 Digite para pesquisar a máquina...',
          searchResultLimit: -1,
          noResultsText: 'Nenhuma máquina encontrada',
          itemSelectText: '',
          shouldSort: false,
          allowHTML: true
        });

        selectMaquina.addEventListener('choice', (e) => {
          if (e.detail && e.detail.choice) {
            buscarHistoricoMaquina(e.detail.choice.value);
          }
        });
      } catch (err) {
        console.warn('Fallback ativado: utilizando dropdown nativo.', err);
        selectMaquina.addEventListener('change', (e) => {
          buscarHistoricoMaquina(e.target.value);
        });
      }
    });

    function carregarNomeTecnico() {
      const urlParams = new URLSearchParams(window.location.search);
      const nomeUrl = urlParams.get('tecnico') || urlParams.get('nome');
      const userTelegram = tg.initDataUnsafe?.user;
      
      let nomeTelegram = '';
      if (userTelegram) {
        nomeTelegram = `${userTelegram.first_name || ''} ${userTelegram.last_name || ''}`.trim() || userTelegram.username;
      }

      const nomeCustom = localStorage.getItem('userCustomName');
      const nomeSalvo = localStorage.getItem('userTelegramName');
      const nomeFinal = nomeCustom || nomeUrl || nomeTelegram || nomeSalvo || 'Técnico';
      
      const campoTecnico = document.getElementById('tecnico');
      campoTecnico.value = nomeFinal;
      if (nomeFinal === 'Técnico') {
        campoTecnico.removeAttribute('readonly');
      }
    }

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function fazerRequisicaoSegura(url, tempoLimiteMs = 8000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), tempoLimiteMs);

      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error(`Status ${response.status}`);
        return await response.text();
      } catch (erro) {
        clearTimeout(timeoutId);
        if (erro.name === 'AbortError') {
          throw new Error('A conexão demorou muito para responder (Timeout).');
        } else if (!navigator.onLine) {
          throw new Error('Você está sem conexão com a internet.');
        } else {
          throw new Error('Falha de conexão ao acessar os dados.');
        }
      }
    }

    async function buscarHistoricoMaquina(maquina) {
      const box = document.getElementById('historicoBox');
      const txt = document.getElementById('historicoTexto');
      const erroBox = document.getElementById('erroBox');
      
      erroBox.style.display = 'none';
      if (!maquina) { box.style.display = 'none'; return; }

      try {
        txt.innerText = 'Carregando...';
        box.style.display = 'block';

        const text = await fazerRequisicaoSegura(URL_GVIZ, 8000);
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        const historico = rows
          .map(r => ({ maquina: r.c[3]?.v, desc: r.c[5]?.v, status: r.c[6]?.v }))
          .filter(r => r.maquina === maquina && r.status && String(r.status).includes('Concluído'));

        if (historico.length > 0) {
          txt.innerText = historico[historico.length - 1].desc;
          box.style.display = 'block';
        } else {
          box.style.display = 'none';
        }
      } catch (e) {
        box.style.display = 'none';
        erroBox.innerHTML = `⚠️ <strong>Aviso:</strong> ${e.message} <button type="button" onclick="buscarHistoricoMaquina('${maquina}')" style="margin-left: 8px; padding: 2px 6px; border: none; border-radius: 4px; cursor: pointer;">🔄 Tentar novamente</button>`;
        erroBox.style.display = 'block';
      }
    }

    // Função de upload usando Imgbb
    async function uploadMidia(file) {
      const apiKey = '3b8da461ffef6bb425c28bb2bdaedec5'; // Chave gratuita Imgbb de exemplo
      const formData = new FormData();
      formData.append('image', file);

      const res = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error('Falha ao subir imagem.');
      }
    }

    const fontScale = localStorage.getItem('userFontScale') || 1.1;
    const theme = localStorage.getItem('userTheme') || 'light';
    document.documentElement.style.setProperty('--font-scale', fontScale);
    if (theme === 'black') document.body.classList.add('theme-black');

    carregarNomeTecnico();

    document.getElementById('formOcorrencia').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = 'Enviando mídia...';

      let mediaUrl = '';
      const inputMidia = document.getElementById('midia');

      // Se houver arquivo selecionado, faz o upload primeiro
      if (inputMidia.files.length > 0) {
        try {
          mediaUrl = await uploadMidia(inputMidia.files[0]);
        } catch (err) {
          alert('Erro ao enviar a imagem. Tente novamente.');
          btn.disabled = false;
          btn.innerText = '🚀 Enviar Ocorrência';
          return;
        }
      }

      btn.innerText = 'Enviando...';

      const dados = {
        acao: 'CRIAR_OCORRENCIA',
        tecnico: document.getElementById('tecnico').value,
        maquina: document.getElementById('maquina').value,
        categoria: document.getElementById('categoria').value,
        status: document.getElementById('status').value,
        descricao: document.getElementById('descricao').value,
        midia: mediaUrl // Envia o link gerado da imagem/vídeo
      };

      tg.sendData(JSON.stringify(dados));
      tg.close();
    });
  </script>
