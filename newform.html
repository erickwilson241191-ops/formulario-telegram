<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrência</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #006699;
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-bg: #eef2f5;
      --card-border: #cccccc;
      --font-scale: 1.1;
    }

    body.theme-black {
      --primary-color: #33b5e5;
      --bg-color: #000000;
      --text-color: #ffffff;
      --secondary-bg: #121212;
      --card-border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale));
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: calc(20px * var(--font-scale));
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: calc(14px * var(--font-scale));
    }

    select, textarea, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: calc(15px * var(--font-scale));
      box-sizing: border-box;
      font-weight: 600;
    }

    input[readonly] {
      opacity: 0.75;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .historico-box {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 10px;
      margin-top: -8px;
      margin-bottom: 16px;
      border-radius: 6px;
      font-size: calc(13px * var(--font-scale));
      display: none;
      color: #0d47a1;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h2>📝 Registrar Nova Ocorrência</h2>

  <form id="formOcorrencia">
    
    <div class="form-group">
      <label for="tecnico">👤 Técnico Responsável:</label>
      <input type="text" id="tecnico" readonly placeholder="Carregando nome...">
    </div>

    <div class="form-group">
      <label for="maquina">🏭 Máquina / Equipamento:</label>
      <select id="maquina" onchange="buscarHistoricoMaquina(this.value)" required>
        <option value="" disabled selected>Selecione a máquina...</option>
        <option value="Torno CNC">Torno CNC</option>
        <option value="Fresadora">Fresadora</option>
        <option value="Prensa Hidráulica">Prensa Hidráulica</option>
        <option value="Compressor de Ar">Compressor de Ar</option>
        <option value="Esteira Transportadora">Esteira Transportadora</option>
        <option value="Injetora">Injetora</option>
        <option value="Outros / Geral">Outros / Geral</option>
      </select>
    </div>

    <div id="historicoBox" class="historico-box">
      💡 <strong>Última solução registrada:</strong>
      <div id="historicoTexto">Carregando...</div>
    </div>

    <div class="form-group">
      <label for="categoria">🏷️ Categoria:</label>
      <select id="categoria" required>
        <option value="Corretiva">🛠️ Corretiva</option>
        <option value="Preventiva">📅 Preventiva</option>
        <option value="Melhoria">💡 Melhoria</option>
        <option value="Pendência">⏳ Pendência</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status">🚨 Status Inicial:</label>
      <select id="status" required>
        <option value="Aberto">🔴 Aberto</option>
        <option value="Andamento">🟡 Em Andamento</option>
        <option value="Concluído">🟢 Concluído</option>
      </select>
    </div>

    <div class="form-group">
      <label for="descricao">📝 Descrição do Problema/Serviço:</label>
      <textarea id="descricao" placeholder="Descreva os detalhes aqui..." required></textarea>
    </div>

    <div class="form-group">
      <label for="foto">📷 Anexar Foto (Opcional):</label>
      <input type="file" id="foto" accept="image/*">
    </div>

    <button type="submit" id="btnSalvar" class="btn-submit">🚀 Enviar Ocorrência</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Client-ID gratuito do Imgur para upload direto sem backend
    const IMGUR_CLIENT_ID = '3b89e378ef86487'; 

    if (tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(function() {
        window.location.href = 'index.html';
      });
    }

    function carregarNomeTecnico() {
      const urlParams = new URLSearchParams(window.location.search);
      const nomeUrl = urlParams.get('tecnico') || urlParams.get('nome');
      const userTelegram = tg.initDataUnsafe?.user;
      
      let nomeTelegram = '';
      if (userTelegram) {
        nomeTelegram = `${userTelegram.first_name || ''} ${userTelegram.last_name || ''}`.trim() || userTelegram.username;
      }

      const nomeCustom = localStorage.getItem('userCustomName');
      const nomeSalvo = localStorage.getItem('userTelegramName');
      const nomeFinal = nomeCustom || nomeUrl || nomeTelegram || nomeSalvo || 'Técnico';
      
      const campoTecnico = document.getElementById('tecnico');
      campoTecnico.value = nomeFinal;
      if (nomeFinal === 'Técnico') {
        campoTecnico.removeAttribute('readonly');
      }
    }

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function buscarHistoricoMaquina(maquina) {
      const box = document.getElementById('historicoBox');
      const txt = document.getElementById('historicoTexto');
      if (!maquina) { box.style.display = 'none'; return; }

      try {
        const response = await fetch(URL_GVIZ);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        const historico = rows
          .map(r => ({ maquina: r.c[3]?.v, desc: r.c[5]?.v, status: r.c[6]?.v }))
          .filter(r => r.maquina === maquina && r.status && String(r.status).includes('Concluído'));

        if (historico.length > 0) {
          txt.innerText = historico[historico.length - 1].desc;
          box.style.display = 'block';
        } else {
          box.style.display = 'none';
        }
      } catch (e) { box.style.display = 'none'; }
    }

    async function uploadFotoImgur(file) {
      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch('https://api.imgur.com/3/image', {
        method: 'POST',
        headers: {
          Authorization: `Client-ID ${IMGUR_CLIENT_ID}`
        },
        body: formData
      });

      const resData = await response.json();
      if (resData.success) {
        return resData.data.link;
      } else {
        throw new Error('Erro ao enviar imagem ao Imgur');
      }
    }

    const fontScale = localStorage.getItem('userFontScale') || 1.1;
    const theme = localStorage.getItem('userTheme') || 'light';
    document.documentElement.style.setProperty('--font-scale', fontScale);
    if (theme === 'black') document.body.classList.add('theme-black');

    carregarNomeTecnico();

    document.getElementById('formOcorrencia').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = 'Enviando imagem...';

      const fileInput = document.getElementById('foto');
      let urlFoto = 'Sem arquivo';

      try {
        if (fileInput.files.length > 0) {
          urlFoto = await uploadFotoImgur(fileInput.files[0]);
        }

        btn.innerText = 'Salvando registro...';

        const dados = {
          acao: 'CRIAR_OCORRENCIA',
          tecnico: document.getElementById('tecnico').value,
          maquina: document.getElementById('maquina').value,
          categoria: document.getElementById('categoria').value,
          status: document.getElementById('status').value,
          descricao: document.getElementById('descricao').value,
          urlFoto: urlFoto,
          enviarGrupo: true
        };

        tg.sendData(JSON.stringify(dados));
        tg.close();
      } catch (err) {
        alert("Erro ao enviar imagem. Verifique sua conexão e tente novamente.");
        btn.disabled = false;
        btn.innerText = '🚀 Enviar Ocorrência';
      }
    });
  </script>
</body>
</html>
