<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrência</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #0088cc;
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; }
    h2 { color: var(--primary-color); margin-top: 0; font-size: 18px; }
    label { font-weight: bold; font-size: 13px; display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; background-color: var(--secondary-bg); color: var(--text-color); }
    textarea { resize: vertical; height: 80px; }
    
    /* Sugestão Inteligente */
    .historico-box { background: #e3f2fd; border-left: 4px solid #2196f3; padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 12px; display: none; }
    .historico-box strong { color: #0d47a1; }
    
    .btn-submit { width: 100%; background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    .btn-submit:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>📝 Registrar Ocorrência</h2>

  <form id="formOcorrencia">
    <label for="tecnico">Técnico Responsável:</label>
    <input type="text" id="tecnico" required placeholder="Seu nome">

    <label for="maquina">Máquina / Equipamento:</label>
    <select id="maquina" onchange="buscarHistoricoMaquina(this.value)" required>
      <option value="">Selecione...</option>
      <option value="Torno CNC">Torno CNC</option>
      <option value="Prensa Hidráulica">Prensa Hidráulica</option>
      <option value="Injetora">Injetora</option>
      <option value="Compressor">Compressor</option>
    </select>

    <!-- DICA DO HISTÓRICO -->
    <div id="historicoBox" class="historico-box">
      💡 <strong>Última solução nesta máquina:</strong>
      <div id="historicoTexto">Carregando...</div>
    </div>

    <label for="categoria">Categoria:</label>
    <select id="categoria" required>
      <option value="Corretiva">🛠️ Corretiva</option>
      <option value="Preventiva">📅 Preventiva</option>
      <option value="Melhoria">💡 Melhoria</option>
      <option value="Pendência">⏳ Pendência</option>
    </select>

    <label for="descricao">Descrição do Problema:</label>
    <textarea id="descricao" required placeholder="Detalle o que aconteceu..."></textarea>

    <label for="foto">Anexar Foto:</label>
    <input type="file" id="foto" accept="image/*">

    <button type="submit" id="btnSalvar" class="btn-submit">Enviar Ocorrência</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => window.location.href = 'index.html');

    const ID_PLANILHA = '1rDqK6M7jGopEu1htqOZFRM0P_74yqLIjgY7bWOZEteg';
    const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:json`;

    async function buscarHistoricoMaquina(maquina) {
      const box = document.getElementById('historicoBox');
      const txt = document.getElementById('historicoTexto');
      if (!maquina) { box.style.display = 'none'; return; }

      try {
        const response = await fetch(URL_GVIZ);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        // Procura a última encerrada/concluída para essa máquina
        const historico = rows
          .map(r => ({ maquina: r.c[3]?.v, desc: r.c[5]?.v, status: r.c[6]?.v }))
          .filter(r => r.maquina === maquina && r.status && r.status.includes('Concluído'));

        if (historico.length > 0) {
          const ultima = historico[historico.length - 1];
          txt.innerText = ultima.desc;
          box.style.display = 'block';
        } else {
          box.style.display = 'none';
        }
      } catch (e) { box.style.display = 'none'; }
    }

    document.getElementById('formOcorrencia').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = 'Enviando...';

      const fileInput = document.getElementById('foto');
      let base64Image = '';

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        base64Image = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        acao: 'CRIAR_OCORRENCIA',
        tecnico: document.getElementById('tecnico').value,
        maquina: document.getElementById('maquina').value,
        categoria: document.getElementById('categoria').value,
        descricao: document.getElementById('descricao').value,
        imagemBase64: base64Image
      };

      tg.sendData(JSON.stringify(payload));
    });
  </script>
</body>
</html>
