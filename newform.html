<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrência</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #006699;
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-bg: #eef2f5;
      --card-border: #cccccc;
      --font-scale: 1.1;
    }

    body.theme-black {
      --primary-color: #33b5e5;
      --bg-color: #000000;
      --text-color: #ffffff;
      --secondary-bg: #121212;
      --card-border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-size: calc(16px * var(--font-scale));
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: calc(20px * var(--font-scale));
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: calc(14px * var(--font-scale));
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: calc(15px * var(--font-scale));
      box-sizing: border-box;
      font-weight: 600;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: calc(16px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h2>📝 Registrar Nova Ocorrência</h2>

  <form id="formOcorrencia">
    
    <!-- SELEÇÃO DE MÁQUINA DIRETA (SEM ABA DE PESQUISA) -->
    <div class="form-group">
      <label for="maquina">🏭 Máquina / Equipamento:</label>
      <select id="maquina" required>
        <option value="" disabled selected>Selecione a máquina...</option>
        <option value="Torno CNC">Torno CNC</option>
        <option value="Fresadora">Fresadora</option>
        <option value="Prensa Hidráulica">Prensa Hidráulica</option>
        <option value="Compressor de Ar">Compressor de Ar</option>
        <option value="Esteira Transportadora">Esteira Transportadora</option>
        <option value="Injetora">Injetora</option>
        <option value="Outros / Geral">Outros / Geral</option>
      </select>
    </div>

    <!-- CATEGORIA -->
    <div class="form-group">
      <label for="categoria">🏷️ Categoria:</label>
      <select id="categoria" required>
        <option value="Corretiva">🛠️ Corretiva</option>
        <option value="Preventiva">📅 Preventiva</option>
        <option value="Melhoria">💡 Melhoria</option>
        <option value="Pendência">⏳ Pendência</option>
      </select>
    </div>

    <!-- STATUS -->
    <div class="form-group">
      <label for="status">🚨 Status Inicial:</label>
      <select id="status" required>
        <option value="Aberto">🔴 Aberto</option>
        <option value="Andamento">🟡 Em Andamento</option>
        <option value="Concluído">🟢 Concluído</option>
      </select>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="form-group">
      <label for="descricao">📝 Descrição do Problema/Serviço:</label>
      <textarea id="descricao" placeholder="Descreva os detalhes aqui..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">🚀 Enviar Ocorrência</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // BOTÃO VOLTAR NATIVO DO TELEGRAM
    tg.BackButton.show();
    tg.BackButton.onClick(function() {
      window.location.href = 'index.html';
    });

    // Aplica preferências visuais
    const fontScale = localStorage.getItem('userFontScale') || 1.1;
    const theme = localStorage.getItem('userTheme') || 'light';
    document.documentElement.style.setProperty('--font-scale', fontScale);
    if (theme === 'black') document.body.classList.add('theme-black');

    // Envio do Formulário
    document.getElementById('formOcorrencia').addEventListener('submit', function(e) {
      e.preventDefault();

      const dados = {
        maquina: document.getElementById('maquina').value,
        categoria: document.getElementById('categoria').value,
        status: document.getElementById('status').value,
        descricao: document.getElementById('descricao').value,
        enviarGrupo: true
      };

      tg.sendData(JSON.stringify(dados));
    });
  </script>
</body>
</html>
